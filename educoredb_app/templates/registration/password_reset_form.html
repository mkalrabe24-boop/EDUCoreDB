{% extends 'registration/base.html' %}
{% block content %}
  <div class="card-header">
    <h1 class="card-title">Reset Password</h1>
  </div>
  <div class="card-body">
    <p class="login-box-msg">Enter your email and we will send reset instructions.</p>

    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="form-group">
        {{ field.errors }}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        <input type="email" id="{{ field.id_for_label }}" name="{{ field.html_name }}" class="form-control" required>
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>

    <div class="mt-3 text-center">
      <a href="{% url 'show_login' %}">Back to login</a>
    </div>
  </div>
{% endblock content %}
